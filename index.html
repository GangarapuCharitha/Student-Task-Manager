
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyFlow - Student Task Manager</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                StudyFlow
            </a>

            <span class="text-white">
                Student Task Manager
            </span>
        </div>
    </nav>

    <main class="container py-4">

        <!-- Welcome Section -->
        <section class="mb-4">
            <h2>Welcome to StudyFlow!</h2>
            <p class="text-muted">
                Organize your studies and manage your daily tasks.
            </p>
        </section>

        <!-- Dashboard -->
        <section class="row g-3 mb-4">

            <div class="col-6 col-md-3">
                <div class="dashboard-card">
                    <p>Total Tasks</p>
                    <h2 id="totalCount">0</h2>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="dashboard-card">
                    <p>Pending Tasks</p>
                    <h2 id="pendingCount">0</h2>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="dashboard-card">
                    <p>Completed Tasks</p>
                    <h2 id="completedCount">0</h2>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="dashboard-card">
                    <p>Today's Tasks</p>
                    <h2 id="todayCount">0</h2>
                </div>
            </div>

        </section>

        <!-- Add Task Form -->
        <section class="card shadow-sm mb-4">

            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Add New Task</h5>
            </div>

            <div class="card-body">

                <form id="taskForm" novalidate>

                    <input type="hidden" id="taskId">

                    <div class="mb-3">
                        <label for="taskTitle" class="form-label">
                            Task Title
                        </label>

                        <input
                            type="text"
                            id="taskTitle"
                            class="form-control"
                            placeholder="Enter your task"
                            required
                            minlength="3"
                        >
                    </div>

                    <div class="row">

                        <div class="col-md-4 mb-3">
                            <label for="taskCategory" class="form-label">
                                Category
                            </label>

                            <select
                                id="taskCategory"
                                class="form-select"
                                required
                            >
                                <option value="">Select Category</option>
                                <option value="Study">Study</option>
                                <option value="Assignment">Assignment</option>
                                <option value="Personal">Personal</option>
                                <option value="Project">Project</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="taskDate" class="form-label">
                                Due Date
                            </label>

                            <input
                                type="date"
                                id="taskDate"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="taskPriority" class="form-label">
                                Priority
                            </label>

                            <select
                                id="taskPriority"
                                class="form-select"
                                required
                            >
                                <option value="">Select Priority</option>
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>

                    </div>

                    <button
                        type="submit"
                        id="saveBtn"
                        class="btn btn-primary"
                    >
                        Add Task
                    </button>

                    <button
                        type="button"
                        id="cancelEditBtn"
                        class="btn btn-secondary d-none"
                    >
                        Cancel Edit
                    </button>

                </form>

                <div id="message" class="mt-3" role="status"></div>

            </div>
        </section>

        <!-- All Tasks -->
        <section class="card shadow-sm">

            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">All Tasks</h5>
            </div>

            <div class="card-body">

                <!-- Search and Filter -->
                <div class="row mb-3">

                    <div class="col-md-7 mb-2">
                        <input
                            type="search"
                            id="searchInput"
                            class="form-control"
                            placeholder="Search tasks..."
                        >
                    </div>

                    <div class="col-md-5 mb-2">
                        <select id="filterSelect" class="form-select">
                            <option value="all">All Tasks</option>
                            <option value="pending">Pending Tasks</option>
                            <option value="completed">Completed Tasks</option>
                        </select>
                    </div>

                </div>

                <!-- Task List -->
                <div id="taskList">

                    <p class="text-muted">
                        No tasks added yet.
                    </p>

                </div>

                <button
                    type="button"
                    id="loadSampleBtn"
                    class="btn btn-outline-primary mt-3"
                >
                    Load Sample Tasks from API
                </button>

            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center py-3 mt-4">
        <p class="mb-0">
            StudyFlow Student Task Manager | HTML CSS JavaScript
        </p>
    </footer>

</body>
</html>
